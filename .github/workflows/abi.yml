name: abi

# libomx-clap-core.so.1 compared with the baseline of its last release (abi/libomx-clap-core.so.1.abi): tests/abi-check.sh
# reads the rule off the report. Called by ci.yml on every push and pull request and by release.yml before anything is built.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  abi:
    name: ABI of libomx-clap-core against its baseline
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.OMX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    container:
      image: fedora:44
    steps:
      - name: Install the build tools
        run: dnf install -y --setopt=install_weak_deps=False git gcc make diffutils pkgconf-pkg-config clap-devel openssl-devel libabigail dwarves dnf5-plugins

      # omx-dsp's headers, which hosted_stage.h includes, and omx-contract's, which omx-dsp's name, from the OpenMixer
      # channel; clap_host.h's hosting codes are this tree's, src/omx_clap_core_vocabulary.h
      - name: Add the OpenMixer repository
        uses: FreeMixer/.github/.github/actions/add-openmixer@v1

      - name: Install omx-dsp-devel and omx-contract-devel from the OpenMixer channel
        run: |
          set -euo pipefail
          dnf install -y --setopt=install_weak_deps=False 'omx-dsp-devel >= 0.30.0' 'omx-contract-devel >= 3.9.0'

      - uses: actions/checkout@v4

      - name: Compare the build with the baseline
        run: make abi-check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libomx-clap-core-abi
          path: |
            build/new.abi
            build/abidiff.txt
          if-no-files-found: ignore
          retention-days: 14
