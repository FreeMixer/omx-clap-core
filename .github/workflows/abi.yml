name: abi

# libomx-clap-core.so.1 compared with the baseline of its last release (abi/libomx-clap-core.so.1.abi): tests/abi-check.sh
# reads the rule off the report. Called by ci.yml on every push and pull request and by release.yml before anything is built.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  abi:
    name: ABI of libomx-clap-core against its baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: fedora:44
    steps:
      - name: Install the build tools
        run: dnf install -y --setopt=install_weak_deps=False git gcc make diffutils pkgconf-pkg-config clap-devel libabigail dwarves dnf5-plugins

      # omx-dsp's headers, which hosted_stage.h includes, and omx-contract's, whose omx_vocabulary.h clap_host.h
      # includes, from the FreeMixer channel
      - name: Install omx-dsp-devel and omx-contract-devel from the FreeMixer channel
        run: |
          set -euo pipefail
          dnf config-manager addrepo --from-repofile=https://freemixer.github.io/rpm/freemixer.repo
          dnf install -y --setopt=install_weak_deps=False omx-dsp-devel 'omx-contract-devel >= 2.18.0'

      - uses: actions/checkout@v4

      - name: Compare the build with the baseline
        run: make abi-check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libomx-clap-core-abi
          path: |
            build/new.abi
            build/abidiff.txt
          if-no-files-found: ignore
          retention-days: 14
