name: ci

# The tests that need no audio server run on every push and pull request, then the RPMs are built as
# artifacts, on both architectures, and installed in a clean container. Nothing is signed or published
# here: release.yml is a release, run from a version tag, and its dry run is the last job.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels the run it supersedes. Every other run (main, a tag) has a group of its own
  # and is never cancelled; the run id keeps two pushes to main from replacing each other while one is queued.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # plugin-hostd's protocol and pin headers, and the daemon the pin test runs behind, from this release tag
  PLUGIN_HOSTD_REF: v0.15.0
  # plugin-hostd-tests' lib/ (protocol.sh, plugin_hostd_client.py), which every e2e script and bench sources, from the release
  # tag that first ships it; the headers and the daemon above stay at their own tag
  PLUGIN_HOSTD_TESTS_REF: v0.15.0
  # omx-contract's reader, render and install script, which data/ is read back through, from this release tag
  OMX_CONTRACT_REF: v3.4.0

jobs:
  # The packages and their smoke tests are built from the whole tree but fuzz/, bench/, the top-level pages and the licence:
  # a pull request that changes only those skips them (the jobs below that need this one). main and tags run them always.
  changes:
    name: what the pull request changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.diff.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # The checkout of a pull request is its merge commit and the first parent is the base, so this diff is what the
      # pull request adds. Any other event, or a diff that cannot be read, says true: main and tags always run it.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ] || ! changed=$(git diff --name-only HEAD^1 HEAD) || [ -z "$changed" ]; then
            echo "packages=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$changed"
          if grep -qvE '^(fuzz/|bench/|[^/]*\.md$|COPYING$|LICENSE$|\.github/workflows/fuzz\.yml$)' <<<"$changed"; then
            echo "packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "packages=false" >> "$GITHUB_OUTPUT"
          fi

  version:
    name: VERSION agrees with the spec and debian/changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # the file VERSION is the one version the Makefile, the library and the programs carry
      - name: VERSION is the spec's Version and the newest debian/changelog entry
        run: make version-check

  private-refs:
    name: no tracked file points into a private repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: make private-refs
        run: make private-refs

  contract:
    name: data/ read back through omx-contract's reader, the committed headers and ts module its render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch omx-contract at OMX_CONTRACT_REF
        run: |
          set -eu
          case $OMX_CONTRACT_REF in
            v[0-9]*.[0-9]*.[0-9]*) ref=refs/tags/$OMX_CONTRACT_REF ;;
            *) echo "OMX_CONTRACT_REF is $OMX_CONTRACT_REF: pin a release tag" >&2; exit 1 ;;
          esac
          git init -q /tmp/omx-contract
          git -C /tmp/omx-contract fetch -q --depth 1 https://github.com/FreeMixer/omx-contract "$ref"
          git -C /tmp/omx-contract checkout -q FETCH_HEAD
          npm ci --prefix /tmp/omx-contract --omit=dev

      - name: make test-contract
        run: make test-contract OMX_CONTRACT_DIR=/tmp/omx-contract

  docs:
    name: make docs (the public headers are fully documented)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install doxygen
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends doxygen

      - name: make docs
        run: make docs

  test:
    name: build and test
    runs-on: ubuntu-latest
    # the chain host's sabotage builds and runs the host once per guard and drill, about twenty minutes of it (#104)
    timeout-minutes: 50
    container:
      image: fedora:44
      # the jack tests run the host in a user, net, pid and mount namespace of its own
      options: --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined
    steps:
      - name: Install the build tools
        run: |
          dnf install -y --setopt=install_weak_deps=False git gcc make python3 perl-interpreter diffutils pkgconf-pkg-config clap-devel \
            lv2-devel lilv-devel sord binutils pipewire-jack-audio-connection-kit-devel pipewire pipewire-devel pipewire-utils jq iproute util-linux procps-ng libasan libubsan libtsan libabigail \
            python3-numpy python3-lilv \
            libxcb-devel xorg-x11-server-Xvfb xdotool wayland-devel wayland-protocols-devel weston \
            dnf5-plugins

      # omx-dsp's headers, which hosted_stage.h takes its DSP words from, and omx-contract's, the contract directory and
      # its install script data/ (the hosting codes) installs with, from the OpenMixer channel; mod-host, the LV2 identity test's reference arm;
      # and omx-plugins-devel, whose omx_panel_description.h is the ABI test-panel-abi holds src/omx_clap_ext.h to
      - name: Add the OpenMixer repository
        uses: FreeMixer/.github/.github/actions/add-openmixer@v1

      - name: Install omx-dsp-devel, omx-contract-devel, mod-host and omx-plugins-devel from the OpenMixer channel
        run: |
          set -euo pipefail
          dnf install -y --setopt=install_weak_deps=False omx-dsp-devel 'omx-contract-devel >= 3.3.0' mod-host omx-plugins-devel
          pkg-config --modversion omxdsp
          pkg-config --atleast-version=3.3.0 omx-contract
          pkg-config --modversion omxplugins
          command -v mod-host

      - uses: actions/checkout@v4

      - name: Every source names its licence
        run: bash tests/spdx-check.sh

      - uses: FreeMixer/.github/.github/actions/mod-host-protocol@v1

      - name: Install plugin-hostd's headers and build its daemon
        run: |
          set -euo pipefail
          .github/plugin-hostd.sh /tmp/plugin-hostd
          make -C /tmp/plugin-hostd install_protocol PREFIX=/opt/plugin-hostd
          make -C /tmp/plugin-hostd plugin-hostd
          echo "PKG_CONFIG_PATH=/opt/plugin-hostd/share/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          PLUGIN_HOSTD_REF=$PLUGIN_HOSTD_TESTS_REF .github/plugin-hostd.sh /tmp/plugin-hostd-tests
          echo "PLUGIN_HOSTD_TESTS_LIB=/tmp/plugin-hostd-tests/tests/lib" >> "$GITHUB_ENV"
          PKG_CONFIG_PATH=/opt/plugin-hostd/share/pkgconfig pkg-config --modversion plugin-hostd

      - name: Build
        run: make

      # omx-clap-scan --fields against the format tables of omx-contract at OMX_CONTRACT_REF, and --json's resource hints
      # against its RESOURCE_HINTS (this job has the toolchain and the CLAP and LV2 headers the scanner and the fake
      # plugins build with)
      - name: omx-clap-scan --fields reads what the format tables declare, --json the resource hints RESOURCE_HINTS declares
        run: |
          set -eu
          git init -q /tmp/omx-contract
          git -C /tmp/omx-contract fetch -q --depth 1 https://github.com/FreeMixer/omx-contract "refs/tags/$OMX_CONTRACT_REF"
          git -C /tmp/omx-contract checkout -q FETCH_HEAD
          make test-fields OMX_CONTRACT_DIR=/tmp/omx-contract

      # the relaxed-ordering copy of clap_stage.h compiles beside the headers it includes (#165)
      - name: The stage bench builds and runs
        run: make bench-stage

      - name: Test the plugin lifecycle and the scanner against the fake plugins
        run: make test-fake

      # org.openmixer.panel-description/1 as omx_clap_ext.h states it, against omx-plugins' header, the ABI (#337)
      - name: The panel description's structures are the ABI's
        run: make test-panel-abi

      # each rule of the audio layouts broken in a copy of the sources, the test that guards it red (#92)
      - name: The sabotage of the audio layouts
        run: make test-layouts-sabotage

      # the chain's cycles on a thread of their own while the control thread changes it, under ThreadSanitizer (#311)
      - name: Test the chain under ThreadSanitizer
        run: make test-chain-tsan

      # each guard of the chain broken in a copy of the sources, tests/clap_chain_test red on it (#311)
      - name: The sabotage of the chain's guards
        run: make test-chain-sabotage

      # each guard of the resource hints broken in a copy of the sources, the test that holds it red (#323)
      - name: The sabotage of the resource hints' guards
        run: make test-resource-hints-sabotage

      # abi-check.sh's reading of abidiff against a fixture library: a pointee grown reads ok, a function pointer, a
      # retyped pointer and a reorder each FAIL (#323)
      - name: The sabotage of the ABI check's report reading
        run: make test-abi-sabotage

      - name: Test what a plugin reports about its parameters under AddressSanitizer
        run: make test-untrusted-asan

      # the published transport with an audio thread as its one writer and three readers, under ThreadSanitizer (#121)
      - name: Test the published transport under ThreadSanitizer
        run: make test-transport-tsan

      # the cycle gate's sabotage: a gate that never closes must race the deactivate under ThreadSanitizer
      - name: Sabotage the cycle gate under ThreadSanitizer
        run: make test-cycle-gate-sabotage

      # the thread pool's helpers, hand-out word and completion count against the audio and control threads (#395)
      - name: Test the thread pool under ThreadSanitizer
        run: make test-thread-pool-tsan

      # the thread pool's completion wait removed in a copy of the sources, tests/thread_pool_test red on it (#395)
      - name: The sabotage of the thread pool's completion wait
        run: make test-thread-pool-sabotage

      # The LV2 adapter: lv2/core against the fixture bundles through lilv, the CLAP face and libomx-clap-core's body
      # around it, and a program linked through the installed pkg-config file alone
      - name: Test the LV2 adapter
        run: make test-lv2

      - name: What the LV2 adapter costs per process() call
        run: make lv2-cost

      # the stage-2 oracle's kinds each need a fixture: a kind with none fails the job
      - name: Every stage-2 kind has a fixture
        run: make lv2-stage2-kinds

      # The host over jack with an instrument, in a PipeWire of its own. It needs a private user
      # namespace with its own /proc; a runner that refuses one cannot run it, and the step says so.
      - name: Test an instrument over jack
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-jack-synth
          else
            echo "::warning::test-jack-synth SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # A plugin's own window over clap.gui and X11, in a PipeWire and an Xvfb of their own, the same way (#180).
      - name: Test a plugin's own window over X11
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-jack-window
          else
            echo "::warning::test-jack-window SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # The same with Wayland first, beside a headless weston of its own: the Wayland window taken when both displays
      # are there, X11 for a plugin with none, no-display with neither; and the host as X11=0 builds it, no xcb linked,
      # still showing the Wayland window (#329).
      - name: Test a plugin's own window over Wayland first
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-jack-window-wl
          else
            echo "::warning::test-jack-window-wl SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # The transport over jack the same way: the host's own and, with -t, the JACK transport followed.
      - name: Test the transport over jack
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-jack-transport
          else
            echo "::warning::test-jack-transport SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # A plugin's note output over jack the same way: the arpeggiator's notes and the LV2 echo on midi_out at their frames.
      - name: Test the note output over jack
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-jack-notes-out
          else
            echo "::warning::test-jack-notes-out SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # The meters over jack the same way: monitor_output on each derived symbol and the output_set lines of the feedback socket.
      - name: Test the meters over jack
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-jack-meters
          else
            echo "::warning::test-jack-meters SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # The auxiliary ports over jack with the fake plugins: a side chain heard, an auxiliary output read, a bypassed one silent.
      - name: Test the auxiliary ports over jack
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-jack-fake
          else
            echo "::warning::test-jack-fake SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # Layout pinning over jack: pin_expect before add, a layout that differs destroyed before activate.
      - name: Test layout pinning over jack
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-jack-pin
          else
            echo "::warning::test-jack-pin SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # track_info, remote pages and param_info over jack: the fake plugin reads what the host passes it
      - name: Test the strip and the remote pages over jack
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-jack-info
          else
            echo "::warning::test-jack-info SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # --thread-pool over jack (#395): on makes the helpers and they run the plugin's tasks, qualified and off make none
      - name: Test the thread pool over jack
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-jack-pool
          else
            echo "::warning::test-jack-pool SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # the xruns line: the callback the host registered with libjack, the line on the feedback socket
      - name: Test the xruns line over jack
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-jack-xruns
          else
            echo "::warning::test-jack-xruns SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # The command socket's framing against tests/socket_conformance.py: a command of exactly the receive buffer, many
      # commands in one write, one command over many writes, clients that leave mid-command, the size limit and a random
      # chunking fuzz (#103). It checks the protocol library the mod-host-protocol step built, which carries
      # mod-audio/mod-host#113; the log names the library the host loaded.
      - name: Test the command socket's framing
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-socket
          else
            echo "::warning::test-socket SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # the verbs data/verbs.json declares for this host, installed as the package installs them, against its socket and
      # its registration table; then the guard's sabotage: a format and what the host owes a verb changed in the
      # declaration, a handler deleted and a verb with no declaration registered in the host, each red
      - name: Test the verbs the declarations name for this host
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            # plugin-hostd's verbs file (chain of omx-clap-host) is read from the checkout of the release that ships it
            # (PLUGIN_HOSTD_TESTS_REF, /tmp/plugin-hostd-tests), not from the v0.7.0 one of the headers; absent, the target fails
            make test-host-verbs PLUGIN_HOSTD_CONTRACT_DIR=/tmp/plugin-hostd-tests
            make test-host-verbs-sabotage PLUGIN_HOSTD_CONTRACT_DIR=/tmp/plugin-hostd-tests
          else
            echo "::warning::test-host-verbs SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # a plugin that moves its own parameter: param_gesture and param_set on the feedback port, in order
      - name: Test the values and gestures a plugin makes itself over jack
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-jack-params
          else
            echo "::warning::test-jack-params SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # An LV2 plugin through the host: the fixture bundles on LV2_PATH, add lv2:<uri>, the adapter's refusals with their
      # codes in the reply, the control ports by symbol, lv2:enabled as the bypass, state, presets by URI and remove.
      - name: Test an LV2 plugin through the host over jack
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-jack-lv2
          else
            echo "::warning::test-jack-lv2 SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # preset_list, preset_get and preset_load over the socket: fake_synth's preset-discovery factory and the LV2 fixture
      # bundle through the adapter. The verbs' declarations are plugin-hostd 0.13's, from the tests checkout, searched
      # after the pinned headers (omx-clap-core#383).
      - name: Test presets through the host over jack
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            touch src/main.c
            make test-jack-presets PLUGIN_HOSTD_VERBS_DIR=/tmp/plugin-hostd-tests/include
          else
            echo "::warning::test-jack-presets SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # The fixture bundle through mod-host, through this host's adapter and through the adapter in process, bit for bit.
      - name: Test the LV2 path bit for bit against mod-host and the adapter in process
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-identity-lv2
          else
            echo "::warning::test-identity-lv2 SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # The LV2 parity runner: its rules on fake recordings, each broken once and seen red (tests/lv2_parity.py)
      - name: Test the LV2 parity rules
        run: make test-parity-self

      # The CLAP coverage probe: scan parsing, the host loop against a fake host, classify, each rule broken once and
      # seen red (tests/clap_coverage.py); the desk run, make clap-coverage, is not CI's
      - name: Test the CLAP coverage probe's rules
        run: make test-clap-coverage-self

      # docs/clap-compatibility.md against this runner's clap-devel headers: every id they spell a row, every supported
      # cell naming a test that exists, each rule broken once and seen red (tests/clap_doc_check.sh)
      - name: Test the CLAP compatibility page against the headers
        run: make test-clap-doc-check

      # no test or bench writes its own send: they source plugin-hostd-tests' lib/protocol.sh (tests/protocol_client_check.sh)
      - name: Test that no script carries its own protocol client
        run: make test-protocol-client

      # the two clean-root consumer steps below build core_link_test by hand: they must build and run what test-core does
      - name: Test the consumer steps against test-core
        run: make test-ci-consumer-args

      # The parity runner end to end on the fixture bundles, mod-host against the adapter, in a PipeWire of its own
      - name: Test LV2 parity on the fixtures
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-parity-lv2
          else
            echo "::warning::test-parity-lv2 SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # The same behind plugin-hostd with require_pins 1 and this host as its CLAP worker.
      - name: Test layout pinning behind plugin-hostd
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-hostd-pin PLUGIN_HOSTD=/tmp/plugin-hostd/plugin-hostd
          else
            echo "::warning::test-hostd-pin SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # The chain line in one JACK client over jack: three instances one node (pw-dump), the output bit for bit the same
      # instances one client each in eight configurations, every refusal changing nothing (#104)
      - name: Test the chain line over jack
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-chain-host
            make test-chain-identity
          else
            echo "::warning::test-chain-host and test-chain-identity SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # The chain's members walked on JACK's thread while the control thread joins, frees and lets go of members, the
      # host under ThreadSanitizer: no data race in src/effects.c (#104)
      - name: Test the host's chain under ThreadSanitizer
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-chain-host-tsan
          else
            echo "::warning::test-chain-host-tsan SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # A chain behind plugin-hostd and its crash drill: the middle member aborts, is quarantined, the others rejoin in
      # order, bit for bit (#104)
      - name: Test a chain's crash drill behind plugin-hostd
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-hostd-chain PLUGIN_HOSTD=/tmp/plugin-hostd/plugin-hostd
          else
            echo "::warning::test-hostd-chain SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # each guard of the host's chain broken in a copy of the sources, the chain tests red on it (#104)
      - name: The sabotage of the host's chain guards
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-chain-host-sabotage PLUGIN_HOSTD=/tmp/plugin-hostd/plugin-hostd
          else
            echo "::warning::test-chain-host-sabotage SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      - name: Name what this job does not run
        run: |
          echo "test-jack and test-identity are NOT run here: they load omx-delay (.clap from the omx-plugins-clap package, .lv2 from omx-plugins-lv2)."
          echo "They stay in the Makefile for the desk: make test-jack CLAP_TEST_PLUGIN=<omx-delay.clap>; make test-identity."

  # The ABI of libomx-clap-core.so.1 against the baseline of the last release: an addition needs a new minor, a removal or a
  # change needs a new soname major. Nothing here needs jack or the protocol library.
  abi:
    name: ABI of libomx-clap-core against its baseline
    uses: ./.github/workflows/abi.yml

  rpm:
    name: RPMs (fc44, ${{ matrix.arch }}), installed in a clean root
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(github.event_name == 'pull_request' && '["x86_64"]' || '["x86_64", "aarch64"]') }}
    container:
      image: fedora:44
      # the clean root gets a /proc and a /dev of its own
      options: --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined
    steps:
      - name: Install the build tools
        run: dnf install -y --setopt=install_weak_deps=False git rpm-build dnf5-plugins gcc make tar gzip diffutils pkgconf-pkg-config pipewire-jack-audio-connection-kit-devel

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: FreeMixer/.github/.github/actions/mod-host-rpms@v1

      # the spec's BuildRequires: omx-dsp-devel, and omx-contract-devel under it, come from the OpenMixer channel
      - name: Add the OpenMixer repository
        uses: FreeMixer/.github/.github/actions/add-openmixer@v1

      - name: Fetch plugin-hostd
        run: |
          .github/plugin-hostd.sh /tmp/plugin-hostd
          PLUGIN_HOSTD_REF=$PLUGIN_HOSTD_TESTS_REF .github/plugin-hostd.sh /tmp/plugin-hostd-tests

      # plugin-hostd's spec gates its check BuildRequires (omx-clap-host-tests) behind `%bcond_without check`; the
      # user macro turns the check off for builddep and rpmbuild alike, so the channel's libomx-clap-core 0.10.0
      # is never installed under the packages this job builds
      - name: Build the plugin-hostd RPMs without its check stage
        run: echo '%_without_check 1' >> ~/.rpmmacros

      - name: Build the plugin-hostd RPMs
        uses: FreeMixer/.github/.github/actions/build-rpm@v1
        with:
          tree: /tmp/plugin-hostd
          out: plugin-hostd-rpms

      - name: Run this repository's RPM build with its checks
        run: rm -f ~/.rpmmacros

      - name: Install plugin-hostd-devel
        run: |
          set -euo pipefail
          dnf install -y --setopt=install_weak_deps=False plugin-hostd-rpms/plugin-hostd-devel-[0-9]*.noarch.rpm plugin-hostd-rpms/plugin-hostd-contract-[0-9]*.noarch.rpm
          pkg-config --modversion plugin-hostd

      - uses: FreeMixer/.github/.github/actions/build-rpm@v1

      - name: Check the file lists
        run: |
          set -euo pipefail
          files() { rpm -qp --qf '[%{FILEMODES:perms} %{FILENAMES}\n]' "$1" | grep -v -e '^d' -e '/\.build-id/' | cut -d' ' -f2 | sort; }
          for rpm in rpms/omx-clap-host-[0-9]*.${{ matrix.arch }}.rpm; do
            rpm -qlp "$rpm"
            files "$rpm" > files.txt
            printf '%s\n' /usr/bin/omx-clap-host /usr/bin/omx-clap-scan \
              /usr/share/man/man1/omx-clap-host.1.gz /usr/share/man/man1/omx-clap-scan.1.gz \
              /usr/lib/udev/rules.d/60-omx-clap-host.rules \
              /usr/share/doc/omx-clap-host/README.md /usr/share/licenses/omx-clap-host/COPYING | sort > expected.txt
            diff -u expected.txt files.txt
            rpm -qp --requires "$rpm" | tee requires.txt
            grep -q 'libmod-host-protocol.so.0' requires.txt
            grep -q 'libomx-clap-core.so.1' requires.txt
            grep -q 'omx-clap-core.* = ' requires.txt
            # the window links libxcb, so the package requires it (#180)
            grep -q 'libxcb.so.1' requires.txt
          done
          for rpm in rpms/omx-clap-core-[0-9]*.${{ matrix.arch }}.rpm; do
            rpm -qlp "$rpm"
            files "$rpm" > files.txt
            printf '%s\n' '/usr/lib*/libomx-clap-core.so.1' "/usr/lib*/libomx-clap-core.so.$(cat VERSION)" /usr/share/licenses/omx-clap-core/COPYING \
              /usr/share/omx-clap-core/ts/omx-clap-core-hosting.js /usr/share/omx-clap-core/ts/omx-clap-core-hosting.d.ts \
              /usr/share/omx-clap-core/ts/omx-clap-core-vocabulary.js /usr/share/omx-clap-core/ts/omx-clap-core-vocabulary.d.ts | sort > expected.txt
            diff -u <(sed 's,/usr/lib64/,/usr/lib*/,' files.txt) expected.txt
            # the library names no jack and no protocol library
            rpm -qp --requires "$rpm" | tee requires.txt
            ! grep -q -e jack -e mod-host requires.txt
          done
          for rpm in rpms/omx-clap-core-devel-[0-9]*.${{ matrix.arch }}.rpm; do
            rpm -qlp "$rpm"
            files "$rpm" > files.txt
            printf '%s\n' '/usr/lib*/libomx-clap-core.so' '/usr/lib*/pkgconfig/omx-clap-core.pc' /usr/include/omx-clap-host/clap_host.h \
              /usr/include/omx-clap-host/clap_host_limits.h /usr/include/omx-clap-host/omx_clap_core_vocabulary.h /usr/include/omx-clap-host/hosted_stage_limits.h /usr/include/omx-clap-host/clap_stage.h /usr/include/omx-clap-host/hosted_stage.h \
              /usr/include/omx-clap-host/clap_host_extensions.h /usr/include/omx-clap-host/omx_clap_ext.h /usr/include/omx-clap-host/omx_msgring.h /usr/include/omx-clap-host/clap_meters.h /usr/include/omx-clap-host/omx_clap_raw.h /usr/include/omx-clap-host/omx_clap_midi.h /usr/include/omx-clap-host/clap_chain.h \
              /usr/share/omx-clap-core/omx-clap-core.map /usr/share/omx-clap-core/libomx-clap-core.so.1.abi | sort > expected.txt
            diff -u <(sed 's,/usr/lib64/,/usr/lib*/,' files.txt) expected.txt
          done
          # omx-clap-core's definitions in the contract directory, in a package of their own that the runtime and
          # development packages require at their version, read at run time with no -devel installed
          for rpm in rpms/omx-clap-core-contract-[0-9]*.noarch.rpm; do
            rpm -qlp "$rpm"
            files "$rpm" > files.txt
            printf '%s\n' /usr/share/omx-contract/contract.d/3/omx-clap-core/MANIFEST.json /usr/share/omx-contract/contract.d/3/omx-clap-core/hosting.json /usr/share/omx-contract/contract.d/3/omx-clap-core/verbs.json \
              /usr/share/omx-contract/contract.d/3/omx-clap-core/hosting/clap.json /usr/share/omx-contract/contract.d/3/omx-clap-core/hosting/cost.json /usr/share/omx-contract/contract.d/3/omx-clap-core/hosting/features.json /usr/share/omx-contract/contract.d/3/omx-clap-core/hosting/latency.json /usr/share/omx-contract/contract.d/3/omx-clap-core/hosting/output.json /usr/share/omx-contract/contract.d/3/omx-clap-core/hosting/override.json /usr/share/omx-contract/contract.d/3/omx-clap-core/hosting/patch.json /usr/share/omx-contract/contract.d/3/omx-clap-core/hosting/preset.json /usr/share/omx-contract/contract.d/3/omx-clap-core/hosting/provenance.json /usr/share/omx-contract/contract.d/3/omx-clap-core/hosting/realised.json /usr/share/omx-contract/contract.d/3/omx-clap-core/hosting/resource-hints.json /usr/share/omx-contract/contract.d/3/omx-clap-core/hosting/rt-safety.json /usr/share/omx-contract/contract.d/3/omx-clap-core/hosting/stability.json /usr/share/omx-contract/contract.d/3/omx-clap-core/hosting/state.json /usr/share/omx-contract/contract.d/3/omx-clap-core/hosting/topology.json /usr/share/omx-contract/contract.d/3/omx-clap-core/hosting/worker.json \
              /usr/share/licenses/omx-clap-core-contract/COPYING | sort > expected.txt
            diff -u expected.txt files.txt
          done
          for pkg in omx-clap-core omx-clap-core-devel; do
            rpm -qp --requires rpms/$pkg-[0-9]*.${{ matrix.arch }}.rpm | tee requires.txt
            grep -qx "omx-clap-core-contract = $(cat VERSION)-.*" requires.txt
          done
          for rpm in rpms/omx-clap-lv2-devel-[0-9]*.${{ matrix.arch }}.rpm; do
            rpm -qlp "$rpm"
            files "$rpm" > files.txt
            printf '%s\n' '/usr/lib*/libomx-clap-lv2.a' '/usr/lib*/pkgconfig/omx-clap-lv2.pc' /usr/include/omx-clap-lv2/omx_clap_lv2.h \
              /usr/include/omx-clap-lv2/omx_lv2_features.h \
              /usr/share/licenses/omx-clap-lv2-devel/COPYING | sort > expected.txt
            diff -u <(sed 's,/usr/lib64/,/usr/lib*/,' files.txt) expected.txt
            rpm -qp --provides "$rpm" | tee provides.txt
            grep -q 'pkgconfig(omx-clap-lv2)' provides.txt
          done
          # the fixtures a program that drives the worker tests itself against, and nothing else
          for rpm in rpms/omx-clap-host-tests-[0-9]*.${{ matrix.arch }}.rpm; do
            rpm -qlp "$rpm"
            files "$rpm" > files.txt
            printf '%s\n' /usr/libexec/omx-clap-host/tests/fake.clap /usr/libexec/omx-clap-host/tests/fake_compressor.clap \
              /usr/libexec/omx-clap-host/tests/fault-14.clap /usr/libexec/omx-clap-host/tests/jack_identity \
              /usr/libexec/omx-clap-host/tests/jack_meter_source /usr/libexec/omx-clap-host/tests/socket_conformance.py \
              /usr/share/licenses/omx-clap-host-tests/COPYING | sort > expected.txt
            diff -u expected.txt files.txt
            rpm -qp --requires "$rpm" | tee requires.txt
            grep -q '^omx-clap-host' requires.txt
          done
          ls rpms/omx-clap-lv2-devel-[0-9]*.${{ matrix.arch }}.rpm
          ls rpms/omx-clap-host-*.src.rpm

      # a program outside this tree, built against the installed development package and run on the installed library
      - name: A consumer builds against omx-clap-core-devel and runs on omx-clap-core
        run: |
          set -euo pipefail
          # a mirror that fails in mid-transfer (curl 56, zchunk checksums) is tried again; a real install error fails the
          # third attempt with its own output on the log
          dnf_retry() {
            local n
            for n in 1 2 3; do
              dnf install -y --setopt=retries=5 "$@" && return 0
              [ "$n" -lt 3 ] && { echo "::warning::dnf install failed, attempt $n of 3"; sleep 15; }
            done
            return 1
          }
          dnf_retry --setopt=install_weak_deps=False rpms/omx-clap-core-[0-9]*.${{ matrix.arch }}.rpm rpms/omx-clap-core-devel-[0-9]*.${{ matrix.arch }}.rpm \
            rpms/omx-clap-core-contract-[0-9]*.noarch.rpm
          make tests/fake.clap tests/fake_synth.clap tests/fault-1.clap
          pkg-config --modversion omx-clap-core | tee v.txt
          grep -qx "$(cat VERSION)" v.txt
          gcc -O2 -Wall -Wextra -Werror -std=gnu99 -D_GNU_SOURCE -DOMX_EXPECT_VERSION_NUM=$(make -s print-version-num)u -o /tmp/consumer tests/core_link_test.c $(pkg-config --cflags --libs omx-clap-core) -lm
          ldd /tmp/consumer | tee ldd.txt
          grep -q 'libomx-clap-core\.so\.1 => /' ldd.txt
          /tmp/consumer tests/fake.clap tests/fake_synth.clap tests/fault-1.clap | tee consumer.txt
          grep -q 'core link test ok' consumer.txt

      # the verbs the installed declarations name for this host, read from the contract directory omx-clap-core-contract
      # installed, against the installed omx-clap-host and the registration table of the tree it was built from
      - name: The installed host answers the verbs its installed declarations name
        run: |
          set -euo pipefail
          # a mirror that fails in mid-transfer (curl 56, zchunk checksums) is tried again; a real install error fails the
          # third attempt with its own output on the log
          dnf_retry() {
            local n
            for n in 1 2 3; do
              dnf install -y --setopt=retries=5 "$@" && return 0
              [ "$n" -lt 3 ] && { echo "::warning::dnf install failed, attempt $n of 3"; sleep 15; }
            done
            return 1
          }
          dnf_retry --setopt=install_weak_deps=False pipewire iproute util-linux python3 \
            mod-host-rpms/mod-host-protocol-[0-9]*.${{ matrix.arch }}.rpm rpms/omx-clap-host-[0-9]*.${{ matrix.arch }}.rpm \
            plugin-hostd-rpms/plugin-hostd-contract-[0-9]*.noarch.rpm
          rpm -qf /usr/share/omx-contract/contract.d/3/omx-clap-core/verbs.json | grep -q '^omx-clap-core-contract-'
          # plugin-hostd's verbs file names this host too (chain: required), and the check reads it (#361)
          rpm -qf /usr/share/omx-contract/contract.d/3/plugin-hostd/verbs.json | grep -q '^plugin-hostd-contract-'
          scheme=$(printf '#include <plugin-hostd/pin.h>\nPHD_PIN_LAYOUT_SCHEME\n' | gcc $(pkg-config --cflags plugin-hostd) -E -P - | tail -n 1 | tr -d '"')
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            PLUGIN_HOSTD_TESTS_LIB=/tmp/plugin-hostd-tests/tests/lib OMX_CONTRACT_PATH=/usr/share/omx-contract/contract.d OMX_CLAP_HOST=/usr/bin/omx-clap-host PHD_PIN_LAYOUT_SCHEME=$scheme \
              ./tests/host_verbs_e2e.sh
          else
            echo "::warning::the installed verbs SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # the LV2 adapter the same way: built against omx-clap-lv2-devel, run on the fixture bundle with the system's lilv
      - name: A consumer builds against omx-clap-lv2-devel and runs an LV2 plugin
        run: |
          set -euo pipefail
          # a mirror that fails in mid-transfer (curl 56, zchunk checksums) is tried again; a real install error fails the
          # third attempt with its own output on the log
          dnf_retry() {
            local n
            for n in 1 2 3; do
              dnf install -y --setopt=retries=5 "$@" && return 0
              [ "$n" -lt 3 ] && { echo "::warning::dnf install failed, attempt $n of 3"; sleep 15; }
            done
            return 1
          }
          dnf_retry --setopt=install_weak_deps=False rpms/omx-clap-lv2-devel-[0-9]*.${{ matrix.arch }}.rpm lilv-libs
          make build/lv2/omx-host-fixture.lv2/omx-host-fixture.so
          pkg-config --modversion omx-clap-lv2 | tee v.txt
          grep -qx "$(cat VERSION)" v.txt
          gcc -O2 -Wall -Wextra -Werror -std=gnu99 -D_GNU_SOURCE -o /tmp/lv2-consumer lv2/tests/lv2_link_test.c $(pkg-config --cflags --libs omx-clap-lv2)
          ! ldd /tmp/lv2-consumer | grep -q liblilv
          /tmp/lv2-consumer "$PWD/build/lv2/omx-host-fixture.lv2" | tee lv2-consumer.txt
          grep -q 'lv2 link test ok' lv2-consumer.txt

      - name: Build the fake plugins the smoke test scans
        run: make tests/fake.clap tests/fake_synth.clap tests/crash.clap

      - uses: FreeMixer/.github/.github/actions/install-clean@v1
        with:
          rpms: |
            mod-host-rpms/mod-host-[0-9]*.rpm
            mod-host-rpms/mod-host-protocol-[0-9]*.${{ matrix.arch }}.rpm
            rpms/omx-clap-core-[0-9]*.${{ matrix.arch }}.rpm
            rpms/omx-clap-core-contract-[0-9]*.noarch.rpm
            rpms/omx-clap-host-[0-9]*.${{ matrix.arch }}.rpm

      - name: The host reports the version of its package and resolves its libraries
        run: |
          set -euo pipefail
          version=$(rpm --root /tmp/clean-root -q --qf '%{VERSION}' omx-clap-host)
          chroot /tmp/clean-root omx-clap-host -V | tee v.txt
          grep -q "version: $version\$" v.txt
          chroot /tmp/clean-root ldd /usr/bin/omx-clap-host | tee ldd.txt
          ! grep -q 'not found' ldd.txt
          grep -q 'libmod-host-protocol\.so\.0 => /' ldd.txt
          grep -q 'libomx-clap-core\.so\.1 => /' ldd.txt
          # the LV2 adapter is linked in and loads lilv itself, on the first LV2 add
          ! grep -q 'liblilv' ldd.txt
          # the hosting codes' TypeScript modules are in the runtime package: omx-clap-core-devel is not installed
          # in this clean root, and plugin-qualify reads them at this path with no headers
          for f in omx-clap-core-hosting.js omx-clap-core-hosting.d.ts omx-clap-core-vocabulary.js omx-clap-core-vocabulary.d.ts; do
            test -s "/tmp/clean-root/usr/share/omx-clap-core/ts/$f"
          done

      - name: The scanner lists the fake plugins and survives the one that crashes
        run: |
          set -euo pipefail
          mkdir -p /tmp/clean-root/smoke
          cp tests/fake.clap tests/fake_synth.clap tests/crash.clap /tmp/clean-root/smoke/
          chroot /tmp/clean-root omx-clap-scan /smoke/fake.clap | tee scan.txt
          test -s scan.txt
          chroot /tmp/clean-root omx-clap-scan --json /smoke/fake_synth.clap | tee scan.json
          grep -q '"scanner":"omx-clap-scan"' scan.json
          chroot /tmp/clean-root omx-clap-scan /smoke/crash.clap | tee crash.txt || true
          grep -q "crashed with signal 6" crash.txt

      # not named omx-clap-host-rpms-*: the release dry run collects that pattern, and these files carry the
      # same names as the release workflow's own build, so the two merged into one corrupt RPM
      - uses: actions/upload-artifact@v4
        with:
          name: omx-clap-host-ci-rpms-fc44-${{ matrix.arch }}
          path: |
            rpms/omx-clap-host-[0-9]*.rpm
            rpms/omx-clap-core-[0-9]*.rpm
            rpms/omx-clap-core-devel-[0-9]*.rpm
            rpms/omx-clap-core-contract-[0-9]*.rpm
            rpms/omx-clap-lv2-devel-[0-9]*.rpm
            rpms/omx-clap-host-tests-[0-9]*.rpm
          if-no-files-found: error
          retention-days: 7

  deb:
    name: DEBs (${{ matrix.suite }}, ${{ matrix.arch }}), built and linted
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie]
        arch: ${{ fromJSON(github.event_name == 'pull_request' && '["amd64"]' || '["amd64", "arm64"]') }}
    defaults:
      run:
        shell: bash
    container:
      image: debian:${{ matrix.suite }}
    steps:
      - name: Install the build tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git dpkg-dev debhelper build-essential lintian

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: FreeMixer/.github/.github/actions/deb-deps@v1

      # the Build-Depends on libomxdsp-dev (and libomx-contract-dev under it) come from the OpenMixer channel
      - name: Add the OpenMixer repository
        uses: FreeMixer/.github/.github/actions/add-openmixer@v1

      - name: Fetch plugin-hostd
        run: .github/plugin-hostd.sh /tmp/plugin-hostd

      # nocheck: plugin-hostd's tests and their build dependency omx-clap-host-tests stay out, so the channel's
      # libomx-clap-core1 is never installed under the packages this job builds. Its own CI runs its tests.
      - name: Build the plugin-hostd DEBs
        uses: FreeMixer/.github/.github/actions/build-deb@v1
        env:
          DEB_BUILD_PROFILES: nocheck
          DEB_BUILD_OPTIONS: nocheck
        with:
          tree: /tmp/plugin-hostd
          out: plugin-hostd-debs

      - name: Install plugin-hostd-dev
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends ./plugin-hostd-debs/plugin-hostd-dev_*.deb ./plugin-hostd-debs/plugin-hostd-contract_*_all.deb
          pkg-config --modversion plugin-hostd

      - uses: FreeMixer/.github/.github/actions/build-deb@v1

      # what the smoke test runs the installed package against, built here for the architecture
      - name: Build the smoke test fixtures
        run: |
          set -euo pipefail
          make tests/fake.clap tests/fake_synth.clap tests/crash.clap tests/fault-1.clap
          mkdir -p smoke
          cp tests/fake.clap tests/fake_synth.clap tests/crash.clap tests/fault-1.clap smoke/

      # a program outside this tree, built against the installed development package and run on the installed library
      - name: A consumer builds against libomx-clap-core-dev and runs on libomx-clap-core1
        run: |
          set -euo pipefail
          # plugin-hostd-contract brought the channel's omx-clap-core-contract; this build's (a ~git version) replaces it
          apt-get install -y --no-install-recommends --allow-downgrades ./debs/libomx-clap-core1_*.deb ./debs/libomx-clap-core-dev_*.deb ./debs/omx-clap-core-contract_*_all.deb
          pkg-config --modversion omx-clap-core | tee v.txt
          grep -qx "$(cat VERSION)" v.txt
          gcc -O2 -Wall -Wextra -Werror -std=gnu99 -D_GNU_SOURCE -DOMX_EXPECT_VERSION_NUM=$(make -s print-version-num)u -o /tmp/consumer tests/core_link_test.c $(pkg-config --cflags --libs omx-clap-core) -lm
          ldd /tmp/consumer | tee ldd.txt
          grep -q 'libomx-clap-core\.so\.1 => /' ldd.txt
          /tmp/consumer smoke/fake.clap smoke/fake_synth.clap smoke/fault-1.clap | tee consumer.txt
          grep -q 'core link test ok' consumer.txt
          dpkg -L libomx-clap-core-dev | tee dev-files.txt
          # the contract directory's files are omx-clap-core-contract's, which both packages depend on at this version
          dpkg -L omx-clap-core-contract | tee contract-files.txt
          grep -qx /usr/share/omx-contract/contract.d/3/omx-clap-core/MANIFEST.json contract-files.txt
          grep -qx /usr/share/omx-contract/contract.d/3/omx-clap-core/hosting.json contract-files.txt
          grep -qx /usr/share/omx-contract/contract.d/3/omx-clap-core/hosting/features.json contract-files.txt
          grep -qx /usr/share/omx-contract/contract.d/3/omx-clap-core/verbs.json contract-files.txt
          ! grep -q '^/usr/share/omx-contract/' dev-files.txt
          dpkg -I debs/omx-clap-core-contract_*_all.deb | grep -E '^ Architecture: all$'
          dpkg -I debs/omx-clap-core-contract_*_all.deb | grep -E '^ Breaks: libomx-clap-core-dev \(<< '
          dpkg -I debs/omx-clap-core-contract_*_all.deb | grep -E '^ Replaces: libomx-clap-core-dev \(<< '
          for deb in debs/libomx-clap-core1_*.deb debs/libomx-clap-core-dev_*.deb; do
            dpkg -I "$deb" | grep -E '^ Depends:.*omx-clap-core-contract \(= '
          done
          grep -qx /usr/include/omx-clap-host/omx_clap_core_vocabulary.h dev-files.txt
          grep -qx /usr/include/omx-clap-host/hosted_stage_limits.h dev-files.txt
          # the hosting codes' TypeScript modules ship in the runtime package: a plugin-qualify-like consumer
          # reads them with no -dev installed, and the Debian file lists never name a path in both packages
          tsdir=$(pkg-config --variable=tsdir omx-clap-core)
          dpkg -L libomx-clap-core1 | sort > core1-files.txt
          grep -qx "$tsdir/omx-clap-core-hosting.js" core1-files.txt
          grep -qx "$tsdir/omx-clap-core-hosting.d.ts" core1-files.txt
          grep -qx "$tsdir/omx-clap-core-vocabulary.js" core1-files.txt
          grep -qx "$tsdir/omx-clap-core-vocabulary.d.ts" core1-files.txt
          ! grep -qx "$tsdir/omx-clap-core-hosting.js" dev-files.txt
          # no FILE in both packages (the shared parent directories, /usr, /usr/share and so on, are in every pair's lists)
          ! comm -12 core1-files.txt <(sort dev-files.txt) | while IFS= read -r p; do [ -d "$p" ] || printf '%s\n' "$p"; done | grep -q .

      # the LV2 adapter: its files, then a program built against libomx-clap-lv2-dev runs the fixture with the system's lilv
      - name: A consumer builds against libomx-clap-lv2-dev and runs an LV2 plugin
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends ./debs/libomx-clap-lv2-dev_*.deb liblilv-0-0
          dpkg -L libomx-clap-lv2-dev | tee lv2-files.txt
          grep -q '/libomx-clap-lv2\.a$' lv2-files.txt
          grep -q '/pkgconfig/omx-clap-lv2\.pc$' lv2-files.txt
          grep -q '/usr/include/omx-clap-lv2/omx_clap_lv2\.h$' lv2-files.txt
          pkg-config --modversion omx-clap-lv2 | tee v.txt
          grep -qx "$(cat VERSION)" v.txt
          make build/lv2/omx-host-fixture.lv2/omx-host-fixture.so
          gcc -O2 -Wall -Wextra -Werror -std=gnu99 -D_GNU_SOURCE -o /tmp/lv2-consumer lv2/tests/lv2_link_test.c $(pkg-config --cflags --libs omx-clap-lv2)
          /tmp/lv2-consumer "$PWD/build/lv2/omx-host-fixture.lv2" | tee lv2-consumer.txt
          grep -q 'lv2 link test ok' lv2-consumer.txt

      # the fixtures package: the five fixtures and the socket conformance script under libexec, and the worker it depends on
      - name: The tests package carries the fixtures and depends on the worker
        run: |
          set -euo pipefail
          dpkg -c debs/omx-clap-host-tests_*.deb | awk '$1 !~ /^d/ && $NF ~ /libexec/ {print $NF}' | sort | tee tests-files.txt
          printf '%s\n' ./usr/libexec/omx-clap-host/tests/fake.clap ./usr/libexec/omx-clap-host/tests/fake_compressor.clap \
            ./usr/libexec/omx-clap-host/tests/fault-14.clap ./usr/libexec/omx-clap-host/tests/jack_identity \
            ./usr/libexec/omx-clap-host/tests/jack_meter_source ./usr/libexec/omx-clap-host/tests/socket_conformance.py \
            | sort > tests-expected.txt
          diff -u tests-expected.txt tests-files.txt
          dpkg -I debs/omx-clap-host-tests_*.deb | grep -E '^ Depends:.*omx-clap-host \(= '

      - uses: actions/upload-artifact@v4
        with:
          name: omx-clap-host-ci-debs-${{ matrix.suite }}-${{ matrix.arch }}
          path: |
            debs/*.deb
            dep-debs/libmod-host-protocol0_*.deb
            smoke
          if-no-files-found: error
          retention-days: 1

  deb-smoke:
    name: DEBs (${{ matrix.suite }}, ${{ matrix.arch }}), installed in a clean container
    needs: deb
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie]
        arch: ${{ fromJSON(github.event_name == 'pull_request' && '["amd64"]' || '["amd64", "arm64"]') }}
    # nothing but the distribution: a dependency the package forgot to declare is missing here
    defaults:
      run:
        shell: bash
    container:
      image: debian:${{ matrix.suite }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: omx-clap-host-ci-debs-${{ matrix.suite }}-${{ matrix.arch }}

      - name: Install the package with its dependencies from the distribution
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends ./debs/omx-clap-host_*.deb ./debs/libomx-clap-core1_*.deb ./debs/omx-clap-core-contract_*_all.deb \
            ./dep-debs/libmod-host-protocol0_*.deb
          dpkg -s libmod-host-protocol0 | grep '^Status: install ok installed'
          dpkg -s libomx-clap-core1 | grep '^Status: install ok installed'
          # the contract directory's files come with the runtime library, no -dev installed
          dpkg -s omx-clap-core-contract | grep '^Status: install ok installed'
          test -s /usr/share/omx-contract/contract.d/3/omx-clap-core/verbs.json

      - name: The host reports the version of its package and resolves its libraries
        run: |
          set -euo pipefail
          version=$(dpkg-query -W -f='${Version}' omx-clap-host)
          omx-clap-host -V | tee v.txt
          grep -q "version: ${version%%~*}\$" v.txt
          ldd /usr/bin/omx-clap-host | tee ldd.txt
          ! grep -q 'not found' ldd.txt
          grep -q 'libmod-host-protocol\.so\.0 => /' ldd.txt
          grep -q 'libomx-clap-core\.so\.1 => /' ldd.txt
          # the window links libxcb, and the package's Depends brought it (#180)
          grep -q 'libxcb\.so\.1 => /' ldd.txt

      - name: The runtime package alone carries the hosting codes' TypeScript modules
        run: |
          set -euo pipefail
          for f in omx-clap-core-hosting.js omx-clap-core-hosting.d.ts omx-clap-core-vocabulary.js omx-clap-core-vocabulary.d.ts; do
            test -s "/usr/share/omx-clap-core/ts/$f"
          done

      - name: The scanner lists the fake plugins and survives the one that crashes
        run: |
          set -euo pipefail
          omx-clap-scan smoke/fake.clap | tee scan.txt
          test -s scan.txt
          omx-clap-scan --json smoke/fake_synth.clap | tee scan.json
          grep -q '"scanner":"omx-clap-scan"' scan.json
          omx-clap-scan smoke/crash.clap | tee crash.txt || true
          grep -q "crashed with signal 6" crash.txt

  # The release workflow as a tag would run it, publishing nothing: both architectures build through the
  # shared workflow and an unsigned tree is assembled. The caller grants what the called workflow may ask
  # for; its publish and release steps do not run here.
  release-dry-run:
    name: release workflow, dry run
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    permissions:
      contents: write
      issues: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      publish: false
      arm: false  # aarch64/arm64 build at release only

  # A commit message is published like a file. A pull request's own commits must carry no
  # attribution line (the commit-message-check action of FreeMixer/.github); what is already on the base is not read.
  commit-message-check:
    name: commit messages pass the message check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      # @main until FreeMixer/.github moves v1 past the action
      - uses: FreeMixer/.github/.github/actions/commit-message-check@main
        with:
          base-ref: ${{ github.event.pull_request.base.ref }}
