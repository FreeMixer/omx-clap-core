name: ci

# The tests that need no audio server run on every push and pull request, then the RPMs are built as
# artifacts, on both architectures, and installed in a clean container. Nothing is signed or published
# here: release.yml is a release, run from a version tag, and its dry run is the last job.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # plugin-hostd's protocol and pin headers, and the daemon the pin test runs behind, from this release tag
  PLUGIN_HOSTD_REF: v0.4.0
  # omx-contract's reader, render and install script, which data/ is read back through, from this release tag
  OMX_CONTRACT_REF: v2.16.0

jobs:
  version:
    name: VERSION agrees with the spec and debian/changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # the file VERSION is the one version the Makefile, the library and the programs carry
      - name: VERSION is the spec's Version and the newest debian/changelog entry
        run: make version-check

  private-refs:
    name: no tracked file points into a private repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: make private-refs
        run: make private-refs

  contract:
    name: data/ read back through omx-contract's reader, the committed headers and ts module its render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch omx-contract at OMX_CONTRACT_REF
        run: |
          set -eu
          case $OMX_CONTRACT_REF in
            v[0-9]*.[0-9]*.[0-9]*) ref=refs/tags/$OMX_CONTRACT_REF ;;
            *) echo "OMX_CONTRACT_REF is $OMX_CONTRACT_REF: pin a release tag" >&2; exit 1 ;;
          esac
          git init -q /tmp/omx-contract
          git -C /tmp/omx-contract fetch -q --depth 1 https://github.com/FreeMixer/omx-contract "$ref"
          git -C /tmp/omx-contract checkout -q FETCH_HEAD
          npm ci --prefix /tmp/omx-contract --omit=dev

      - name: make test-contract
        run: make test-contract OMX_CONTRACT_DIR=/tmp/omx-contract

  docs:
    name: make docs (the public headers are fully documented)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install doxygen
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends doxygen

      - name: make docs
        run: make docs

  test:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: fedora:44
      # the jack tests run the host in a user, net, pid and mount namespace of its own
      options: --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined
    steps:
      - name: Install the build tools
        run: |
          dnf install -y --setopt=install_weak_deps=False git gcc make python3 diffutils pkgconf-pkg-config clap-devel \
            lv2-devel lilv-devel sord binutils pipewire-jack-audio-connection-kit-devel pipewire pipewire-devel pipewire-utils iproute util-linux procps-ng libasan libubsan libtsan \
            python3-numpy python3-lilv \
            dnf5-plugins

      # omx-dsp's headers, which hosted_stage.h takes its DSP words from, and omx-contract under them, from the FreeMixer
      # channel; and mod-host, the LV2 identity test's reference arm
      - name: Install omx-dsp-devel and mod-host from the FreeMixer channel
        run: |
          set -euo pipefail
          dnf config-manager addrepo --from-repofile=https://freemixer.github.io/rpm/freemixer.repo
          dnf install -y --setopt=install_weak_deps=False omx-dsp-devel mod-host
          pkg-config --modversion omxdsp
          command -v mod-host

      - uses: actions/checkout@v4

      - name: Every source names its licence
        run: bash tests/spdx-check.sh

      - uses: FreeMixer/.github/.github/actions/mod-host-protocol@v1

      - name: Install plugin-hostd's headers and build its daemon
        run: |
          set -euo pipefail
          .github/plugin-hostd.sh /tmp/plugin-hostd
          make -C /tmp/plugin-hostd install_protocol PREFIX=/opt/plugin-hostd
          make -C /tmp/plugin-hostd plugin-hostd
          echo "PKG_CONFIG_PATH=/opt/plugin-hostd/share/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          PKG_CONFIG_PATH=/opt/plugin-hostd/share/pkgconfig pkg-config --modversion plugin-hostd

      - name: Build
        run: make

      # the relaxed-ordering copy of clap_stage.h compiles beside the headers it includes (#165)
      - name: The stage bench builds and runs
        run: make bench-stage

      - name: Test the plugin lifecycle and the scanner against the fake plugins
        run: make test-fake

      - name: Test what a plugin reports about its parameters under AddressSanitizer
        run: make test-untrusted-asan

      # the published transport with an audio thread as its one writer and three readers, under ThreadSanitizer (#121)
      - name: Test the published transport under ThreadSanitizer
        run: make test-transport-tsan

      # the cycle gate's sabotage: a gate that never closes must race the deactivate under ThreadSanitizer
      - name: Sabotage the cycle gate under ThreadSanitizer
        run: make test-cycle-gate-sabotage

      # The LV2 adapter: lv2/core against the fixture bundles through lilv, the CLAP face and libomx-clap-core's body
      # around it, and a program linked through the installed pkg-config file alone
      - name: Test the LV2 adapter
        run: make test-lv2

      - name: What the LV2 adapter costs per process() call
        run: make lv2-cost

      # the stage-2 oracle's kinds each need a fixture: a kind with none fails the job
      - name: Every stage-2 kind has a fixture
        run: make lv2-stage2-kinds

      # The host over jack with an instrument, in a PipeWire of its own. It needs a private user
      # namespace with its own /proc; a runner that refuses one cannot run it, and the step says so.
      - name: Test an instrument over jack
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-jack-synth
          else
            echo "::warning::test-jack-synth SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # The transport over jack the same way: the host's own and, with -t, the JACK transport followed.
      - name: Test the transport over jack
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-jack-transport
          else
            echo "::warning::test-jack-transport SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # A plugin's note output over jack the same way: the arpeggiator's notes and the LV2 echo on midi_out at their frames.
      - name: Test the note output over jack
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-jack-notes-out
          else
            echo "::warning::test-jack-notes-out SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # The meters over jack the same way: monitor_output on each derived symbol and the output_set lines of the feedback socket.
      - name: Test the meters over jack
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-jack-meters
          else
            echo "::warning::test-jack-meters SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # Layout pinning over jack: pin_expect before add, a layout that differs destroyed before activate.
      - name: Test layout pinning over jack
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-jack-pin
          else
            echo "::warning::test-jack-pin SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # track_info, remote pages and param_info over jack: the fake plugin reads what the host passes it
      - name: Test the strip and the remote pages over jack
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-jack-info
          else
            echo "::warning::test-jack-info SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # The command socket's framing against tests/socket_conformance.py: a command of exactly the receive buffer, many
      # commands in one write, one command over many writes, clients that leave mid-command, the size limit and a random
      # chunking fuzz (#103). It checks the protocol library the mod-host-protocol step built, which carries
      # mod-audio/mod-host#113; the log names the library the host loaded.
      - name: Test the command socket's framing
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-socket
          else
            echo "::warning::test-socket SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # a plugin that moves its own parameter: param_gesture and param_set on the feedback port, in order
      - name: Test the values and gestures a plugin makes itself over jack
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-jack-params
          else
            echo "::warning::test-jack-params SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # An LV2 plugin through the host: the fixture bundles on LV2_PATH, add lv2:<uri>, the adapter's refusals with their
      # codes in the reply, the control ports by symbol, lv2:enabled as the bypass, state, presets by URI and remove.
      - name: Test an LV2 plugin through the host over jack
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-jack-lv2
          else
            echo "::warning::test-jack-lv2 SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # The fixture bundle through mod-host, through this host's adapter and through the adapter in process, bit for bit.
      - name: Test the LV2 path bit for bit against mod-host and the adapter in process
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-identity-lv2
          else
            echo "::warning::test-identity-lv2 SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # The LV2 parity runner: its rules on fake recordings, each broken once and seen red (tests/lv2_parity.py)
      - name: Test the LV2 parity rules
        run: make test-parity-self

      # The parity runner end to end on the fixture bundles, mod-host against the adapter, in a PipeWire of its own
      - name: Test LV2 parity on the fixtures
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-parity-lv2
          else
            echo "::warning::test-parity-lv2 SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      # The same behind plugin-hostd with require_pins 1 and this host as its CLAP worker.
      - name: Test layout pinning behind plugin-hostd
        run: |
          if unshare --user --map-root-user --net --pid --fork --mount-proc true; then
            make test-hostd-pin PLUGIN_HOSTD=/tmp/plugin-hostd/plugin-hostd
          else
            echo "::warning::test-hostd-pin SKIPPED: this runner refuses a private user and pid namespace with its own /proc"
          fi

      - name: Name what this job does not run
        run: |
          echo "test-jack and test-identity are NOT run here: they load omx-delay (.clap from the omx-plugins-clap package, .lv2 from omx-plugins-lv2)."
          echo "They stay in the Makefile for the desk: make test-jack CLAP_TEST_PLUGIN=<omx-delay.clap>; make test-identity."

  # The ABI of libomx-clap-core.so.1 against the baseline of the last release: an addition needs a new minor, a removal or a
  # change needs a new soname major. Nothing here needs jack or the protocol library.
  abi:
    name: ABI of libomx-clap-core against its baseline
    uses: ./.github/workflows/abi.yml

  rpm:
    name: RPMs (fc44, ${{ matrix.arch }}), installed in a clean root
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    container:
      image: fedora:44
      # the clean root gets a /proc and a /dev of its own
      options: --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined
    steps:
      - name: Install the build tools
        run: dnf install -y --setopt=install_weak_deps=False git rpm-build dnf5-plugins gcc make tar gzip diffutils pkgconf-pkg-config pipewire-jack-audio-connection-kit-devel

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: FreeMixer/.github/.github/actions/mod-host-rpms@v1

      # the spec's BuildRequires: omx-dsp-devel, and omx-contract-devel under it, come from the FreeMixer channel
      - name: Add the FreeMixer channel
        run: dnf config-manager addrepo --from-repofile=https://freemixer.github.io/rpm/freemixer.repo

      - name: Fetch plugin-hostd
        run: .github/plugin-hostd.sh /tmp/plugin-hostd

      # plugin-hostd's spec gates its check BuildRequires (omx-clap-host-tests) behind `%bcond_without check`; the
      # user macro turns the check off for builddep and rpmbuild alike, so the channel's libomx-clap-core 0.10.0
      # is never installed under the packages this job builds
      - name: Build the plugin-hostd RPMs without its check stage
        run: echo '%_without_check 1' >> ~/.rpmmacros

      - name: Build the plugin-hostd RPMs
        uses: FreeMixer/.github/.github/actions/build-rpm@v1
        with:
          tree: /tmp/plugin-hostd
          out: plugin-hostd-rpms

      - name: Run this repository's RPM build with its checks
        run: rm -f ~/.rpmmacros

      - name: Install plugin-hostd-devel
        run: |
          set -euo pipefail
          dnf install -y --setopt=install_weak_deps=False plugin-hostd-rpms/plugin-hostd-devel-[0-9]*.noarch.rpm
          pkg-config --modversion plugin-hostd

      - uses: FreeMixer/.github/.github/actions/build-rpm@v1

      - name: Check the file lists
        run: |
          set -euo pipefail
          files() { rpm -qp --qf '[%{FILEMODES:perms} %{FILENAMES}\n]' "$1" | grep -v -e '^d' -e '/\.build-id/' | cut -d' ' -f2 | sort; }
          for rpm in rpms/omx-clap-host-[0-9]*.${{ matrix.arch }}.rpm; do
            rpm -qlp "$rpm"
            files "$rpm" > files.txt
            printf '%s\n' /usr/bin/omx-clap-host /usr/bin/omx-clap-scan \
              /usr/share/man/man1/omx-clap-host.1.gz /usr/share/man/man1/omx-clap-scan.1.gz \
              /usr/share/doc/omx-clap-host/README.md /usr/share/licenses/omx-clap-host/COPYING | sort > expected.txt
            diff -u expected.txt files.txt
            rpm -qp --requires "$rpm" | tee requires.txt
            grep -q 'libmod-host-protocol.so.0' requires.txt
            grep -q 'libomx-clap-core.so.1' requires.txt
            grep -q 'omx-clap-core.* = ' requires.txt
          done
          for rpm in rpms/omx-clap-core-[0-9]*.${{ matrix.arch }}.rpm; do
            rpm -qlp "$rpm"
            files "$rpm" > files.txt
            printf '%s\n' '/usr/lib*/libomx-clap-core.so.1' "/usr/lib*/libomx-clap-core.so.$(cat VERSION)" /usr/share/licenses/omx-clap-core/COPYING | sort > expected.txt
            diff -u <(sed 's,/usr/lib64/,/usr/lib*/,' files.txt) expected.txt
            # the library names no jack and no protocol library
            rpm -qp --requires "$rpm" | tee requires.txt
            ! grep -q -e jack -e mod-host requires.txt
          done
          for rpm in rpms/omx-clap-core-devel-[0-9]*.${{ matrix.arch }}.rpm; do
            rpm -qlp "$rpm"
            files "$rpm" > files.txt
            printf '%s\n' '/usr/lib*/libomx-clap-core.so' '/usr/lib*/pkgconfig/omx-clap-core.pc' /usr/include/omx-clap-host/clap_host.h \
              /usr/include/omx-clap-host/clap_host_limits.h /usr/include/omx-clap-host/hosted_stage_limits.h /usr/include/omx-clap-host/clap_stage.h /usr/include/omx-clap-host/hosted_stage.h \
              /usr/include/omx-clap-host/clap_host_extensions.h /usr/include/omx-clap-host/omx_clap_ext.h /usr/include/omx-clap-host/omx_msgring.h /usr/include/omx-clap-host/clap_meters.h /usr/include/omx-clap-host/omx_clap_raw.h /usr/include/omx-clap-host/omx_clap_midi.h \
              /usr/share/omx-clap-core/omx-clap-core.map /usr/share/omx-clap-core/libomx-clap-core.so.1.abi \
              /usr/share/omx-clap-core/ts/omx-clap-core-hosting.js /usr/share/omx-clap-core/ts/omx-clap-core-hosting.d.ts \
              /usr/share/omx-contract/contract.d/2/omx-clap-core/MANIFEST.json /usr/share/omx-contract/contract.d/2/omx-clap-core/hosting.json | sort > expected.txt
            diff -u <(sed 's,/usr/lib64/,/usr/lib*/,' files.txt) expected.txt
          done
          for rpm in rpms/omx-clap-lv2-devel-[0-9]*.${{ matrix.arch }}.rpm; do
            rpm -qlp "$rpm"
            files "$rpm" > files.txt
            printf '%s\n' '/usr/lib*/libomx-clap-lv2.a' '/usr/lib*/pkgconfig/omx-clap-lv2.pc' /usr/include/omx-clap-lv2/omx_clap_lv2.h \
              /usr/include/omx-clap-lv2/omx_lv2_features.h \
              /usr/share/licenses/omx-clap-lv2-devel/COPYING | sort > expected.txt
            diff -u <(sed 's,/usr/lib64/,/usr/lib*/,' files.txt) expected.txt
            rpm -qp --provides "$rpm" | tee provides.txt
            grep -q 'pkgconfig(omx-clap-lv2)' provides.txt
          done
          # the fixtures a program that drives the worker tests itself against, and nothing else
          for rpm in rpms/omx-clap-host-tests-[0-9]*.${{ matrix.arch }}.rpm; do
            rpm -qlp "$rpm"
            files "$rpm" > files.txt
            printf '%s\n' /usr/libexec/omx-clap-host/tests/fake.clap /usr/libexec/omx-clap-host/tests/fake_compressor.clap \
              /usr/libexec/omx-clap-host/tests/jack_meter_source /usr/libexec/omx-clap-host/tests/socket_conformance.py \
              /usr/share/licenses/omx-clap-host-tests/COPYING | sort > expected.txt
            diff -u expected.txt files.txt
            rpm -qp --requires "$rpm" | tee requires.txt
            grep -q '^omx-clap-host' requires.txt
          done
          ls rpms/omx-clap-lv2-devel-[0-9]*.${{ matrix.arch }}.rpm
          ls rpms/omx-clap-host-*.src.rpm

      # a program outside this tree, built against the installed development package and run on the installed library
      - name: A consumer builds against omx-clap-core-devel and runs on omx-clap-core
        run: |
          set -euo pipefail
          dnf install -y --setopt=install_weak_deps=False rpms/omx-clap-core-[0-9]*.${{ matrix.arch }}.rpm rpms/omx-clap-core-devel-[0-9]*.${{ matrix.arch }}.rpm
          make tests/fake.clap tests/fake_synth.clap
          pkg-config --modversion omx-clap-core | tee v.txt
          grep -qx "$(cat VERSION)" v.txt
          gcc -O2 -Wall -Wextra -Werror -std=gnu99 -D_GNU_SOURCE -DOMX_EXPECT_VERSION_NUM=$(make -s print-version-num)u -o /tmp/consumer tests/core_link_test.c $(pkg-config --cflags --libs omx-clap-core) -lm
          ldd /tmp/consumer | tee ldd.txt
          grep -q 'libomx-clap-core\.so\.1 => /' ldd.txt
          /tmp/consumer tests/fake.clap tests/fake_synth.clap | tee consumer.txt
          grep -q 'core link test ok' consumer.txt

      # the LV2 adapter the same way: built against omx-clap-lv2-devel, run on the fixture bundle with the system's lilv
      - name: A consumer builds against omx-clap-lv2-devel and runs an LV2 plugin
        run: |
          set -euo pipefail
          dnf install -y --setopt=install_weak_deps=False rpms/omx-clap-lv2-devel-[0-9]*.${{ matrix.arch }}.rpm lilv-libs
          make build/lv2/omx-host-fixture.lv2/omx-host-fixture.so
          pkg-config --modversion omx-clap-lv2 | tee v.txt
          grep -qx "$(cat VERSION)" v.txt
          gcc -O2 -Wall -Wextra -Werror -std=gnu99 -D_GNU_SOURCE -o /tmp/lv2-consumer lv2/tests/lv2_link_test.c $(pkg-config --cflags --libs omx-clap-lv2)
          ! ldd /tmp/lv2-consumer | grep -q liblilv
          /tmp/lv2-consumer "$PWD/build/lv2/omx-host-fixture.lv2" | tee lv2-consumer.txt
          grep -q 'lv2 link test ok' lv2-consumer.txt

      - name: Build the fake plugins the smoke test scans
        run: make tests/fake.clap tests/fake_synth.clap tests/crash.clap

      - uses: FreeMixer/.github/.github/actions/install-clean@v1
        with:
          rpms: |
            mod-host-rpms/mod-host-[0-9]*.rpm
            mod-host-rpms/mod-host-protocol-[0-9]*.${{ matrix.arch }}.rpm
            rpms/omx-clap-core-[0-9]*.${{ matrix.arch }}.rpm
            rpms/omx-clap-host-[0-9]*.${{ matrix.arch }}.rpm

      - name: The host reports the version of its package and resolves its libraries
        run: |
          set -euo pipefail
          version=$(rpm --root /tmp/clean-root -q --qf '%{VERSION}' omx-clap-host)
          chroot /tmp/clean-root omx-clap-host -V | tee v.txt
          grep -q "version: $version\$" v.txt
          chroot /tmp/clean-root ldd /usr/bin/omx-clap-host | tee ldd.txt
          ! grep -q 'not found' ldd.txt
          grep -q 'libmod-host-protocol\.so\.0 => /' ldd.txt
          grep -q 'libomx-clap-core\.so\.1 => /' ldd.txt
          # the LV2 adapter is linked in and loads lilv itself, on the first LV2 add
          ! grep -q 'liblilv' ldd.txt

      - name: The scanner lists the fake plugins and survives the one that crashes
        run: |
          set -euo pipefail
          mkdir -p /tmp/clean-root/smoke
          cp tests/fake.clap tests/fake_synth.clap tests/crash.clap /tmp/clean-root/smoke/
          chroot /tmp/clean-root omx-clap-scan /smoke/fake.clap | tee scan.txt
          test -s scan.txt
          chroot /tmp/clean-root omx-clap-scan --json /smoke/fake_synth.clap | tee scan.json
          grep -q '"scanner":"omx-clap-scan"' scan.json
          chroot /tmp/clean-root omx-clap-scan /smoke/crash.clap | tee crash.txt || true
          grep -q "crashed with signal 6" crash.txt

      # not named omx-clap-host-rpms-*: the release dry run collects that pattern, and these files carry the
      # same names as the release workflow's own build, so the two merged into one corrupt RPM
      - uses: actions/upload-artifact@v4
        with:
          name: omx-clap-host-ci-rpms-fc44-${{ matrix.arch }}
          path: |
            rpms/omx-clap-host-[0-9]*.rpm
            rpms/omx-clap-core-[0-9]*.rpm
            rpms/omx-clap-core-devel-[0-9]*.rpm
            rpms/omx-clap-lv2-devel-[0-9]*.rpm
            rpms/omx-clap-host-tests-[0-9]*.rpm
          if-no-files-found: error
          retention-days: 7

  deb:
    name: DEBs (${{ matrix.suite }}, ${{ matrix.arch }}), built and linted
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie]
        arch: [amd64, arm64]
    defaults:
      run:
        shell: bash
    container:
      image: debian:${{ matrix.suite }}
    steps:
      - name: Install the build tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git dpkg-dev debhelper build-essential lintian

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: FreeMixer/.github/.github/actions/deb-deps@v1

      # the Build-Depends on libomxdsp-dev (and libomx-contract-dev under it) come from the FreeMixer channel
      - name: Add the FreeMixer channel
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends curl
          install -d /etc/apt/keyrings
          curl -fsSL -o /etc/apt/keyrings/freemixer.asc https://freemixer.github.io/deb/freemixer.asc
          echo "deb [signed-by=/etc/apt/keyrings/freemixer.asc] https://freemixer.github.io/deb/debian/${{ matrix.suite }} ./" > /etc/apt/sources.list.d/freemixer.list
          apt-get update -qq

      - name: Fetch plugin-hostd
        run: .github/plugin-hostd.sh /tmp/plugin-hostd

      # nocheck: plugin-hostd's tests and their build dependency omx-clap-host-tests stay out, so the channel's
      # libomx-clap-core1 is never installed under the packages this job builds. Its own CI runs its tests.
      - name: Build the plugin-hostd DEBs
        uses: FreeMixer/.github/.github/actions/build-deb@v1
        env:
          DEB_BUILD_PROFILES: nocheck
          DEB_BUILD_OPTIONS: nocheck
        with:
          tree: /tmp/plugin-hostd
          out: plugin-hostd-debs

      - name: Install plugin-hostd-dev
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends ./plugin-hostd-debs/plugin-hostd-dev_*.deb
          pkg-config --modversion plugin-hostd

      - uses: FreeMixer/.github/.github/actions/build-deb@v1

      # what the smoke test runs the installed package against, built here for the architecture
      - name: Build the smoke test fixtures
        run: |
          set -euo pipefail
          make tests/fake.clap tests/fake_synth.clap tests/crash.clap
          mkdir -p smoke
          cp tests/fake.clap tests/fake_synth.clap tests/crash.clap smoke/

      # a program outside this tree, built against the installed development package and run on the installed library
      - name: A consumer builds against libomx-clap-core-dev and runs on libomx-clap-core1
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends ./debs/libomx-clap-core1_*.deb ./debs/libomx-clap-core-dev_*.deb
          pkg-config --modversion omx-clap-core | tee v.txt
          grep -qx "$(cat VERSION)" v.txt
          gcc -O2 -Wall -Wextra -Werror -std=gnu99 -D_GNU_SOURCE -DOMX_EXPECT_VERSION_NUM=$(make -s print-version-num)u -o /tmp/consumer tests/core_link_test.c $(pkg-config --cflags --libs omx-clap-core) -lm
          ldd /tmp/consumer | tee ldd.txt
          grep -q 'libomx-clap-core\.so\.1 => /' ldd.txt
          /tmp/consumer smoke/fake.clap smoke/fake_synth.clap | tee consumer.txt
          grep -q 'core link test ok' consumer.txt
          dpkg -L libomx-clap-core-dev | tee dev-files.txt
          grep -qx /usr/share/omx-contract/contract.d/2/omx-clap-core/MANIFEST.json dev-files.txt
          grep -qx /usr/share/omx-contract/contract.d/2/omx-clap-core/hosting.json dev-files.txt
          grep -qx /usr/include/omx-clap-host/hosted_stage_limits.h dev-files.txt
          tsdir=$(pkg-config --variable=tsdir omx-clap-core)
          grep -qx "$tsdir/omx-clap-core-hosting.js" dev-files.txt
          grep -qx "$tsdir/omx-clap-core-hosting.d.ts" dev-files.txt

      # the LV2 adapter: its files, then a program built against libomx-clap-lv2-dev runs the fixture with the system's lilv
      - name: A consumer builds against libomx-clap-lv2-dev and runs an LV2 plugin
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends ./debs/libomx-clap-lv2-dev_*.deb liblilv-0-0
          dpkg -L libomx-clap-lv2-dev | tee lv2-files.txt
          grep -q '/libomx-clap-lv2\.a$' lv2-files.txt
          grep -q '/pkgconfig/omx-clap-lv2\.pc$' lv2-files.txt
          grep -q '/usr/include/omx-clap-lv2/omx_clap_lv2\.h$' lv2-files.txt
          pkg-config --modversion omx-clap-lv2 | tee v.txt
          grep -qx "$(cat VERSION)" v.txt
          make build/lv2/omx-host-fixture.lv2/omx-host-fixture.so
          gcc -O2 -Wall -Wextra -Werror -std=gnu99 -D_GNU_SOURCE -o /tmp/lv2-consumer lv2/tests/lv2_link_test.c $(pkg-config --cflags --libs omx-clap-lv2)
          /tmp/lv2-consumer "$PWD/build/lv2/omx-host-fixture.lv2" | tee lv2-consumer.txt
          grep -q 'lv2 link test ok' lv2-consumer.txt

      # the fixtures package: the three fixtures and the socket conformance script under libexec, and the worker it depends on
      - name: The tests package carries the fixtures and depends on the worker
        run: |
          set -euo pipefail
          dpkg -c debs/omx-clap-host-tests_*.deb | awk '$1 !~ /^d/ && $NF ~ /libexec/ {print $NF}' | sort | tee tests-files.txt
          printf '%s\n' ./usr/libexec/omx-clap-host/tests/fake.clap ./usr/libexec/omx-clap-host/tests/fake_compressor.clap \
            ./usr/libexec/omx-clap-host/tests/jack_meter_source ./usr/libexec/omx-clap-host/tests/socket_conformance.py \
            | sort > tests-expected.txt
          diff -u tests-expected.txt tests-files.txt
          dpkg -I debs/omx-clap-host-tests_*.deb | grep -E '^ Depends:.*omx-clap-host \(= '

      - uses: actions/upload-artifact@v4
        with:
          name: omx-clap-host-ci-debs-${{ matrix.suite }}-${{ matrix.arch }}
          path: |
            debs/*.deb
            dep-debs/libmod-host-protocol0_*.deb
            smoke
          if-no-files-found: error
          retention-days: 1

  deb-smoke:
    name: DEBs (${{ matrix.suite }}, ${{ matrix.arch }}), installed in a clean container
    needs: deb
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie]
        arch: [amd64, arm64]
    # nothing but the distribution: a dependency the package forgot to declare is missing here
    defaults:
      run:
        shell: bash
    container:
      image: debian:${{ matrix.suite }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: omx-clap-host-ci-debs-${{ matrix.suite }}-${{ matrix.arch }}

      - name: Install the package with its dependencies from the distribution
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends ./debs/omx-clap-host_*.deb ./debs/libomx-clap-core1_*.deb ./dep-debs/libmod-host-protocol0_*.deb
          dpkg -s libmod-host-protocol0 | grep '^Status: install ok installed'
          dpkg -s libomx-clap-core1 | grep '^Status: install ok installed'

      - name: The host reports the version of its package and resolves its libraries
        run: |
          set -euo pipefail
          version=$(dpkg-query -W -f='${Version}' omx-clap-host)
          omx-clap-host -V | tee v.txt
          grep -q "version: ${version%%~*}\$" v.txt
          ldd /usr/bin/omx-clap-host | tee ldd.txt
          ! grep -q 'not found' ldd.txt
          grep -q 'libmod-host-protocol\.so\.0 => /' ldd.txt
          grep -q 'libomx-clap-core\.so\.1 => /' ldd.txt

      - name: The scanner lists the fake plugins and survives the one that crashes
        run: |
          set -euo pipefail
          omx-clap-scan smoke/fake.clap | tee scan.txt
          test -s scan.txt
          omx-clap-scan --json smoke/fake_synth.clap | tee scan.json
          grep -q '"scanner":"omx-clap-scan"' scan.json
          omx-clap-scan smoke/crash.clap | tee crash.txt || true
          grep -q "crashed with signal 6" crash.txt

  # The release workflow as a tag would run it, publishing nothing: both architectures build through the
  # shared workflow and an unsigned tree is assembled. The caller grants what the called workflow may ask
  # for; its publish and release steps do not run here.
  release-dry-run:
    name: release workflow, dry run
    permissions:
      contents: write
      issues: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      publish: false

  # A commit message is published like a file. A pull request's own commits must carry no
  # AI-attribution line (tools/ai-trace-commit-check.sh); what is already on the base is not read.
  ai-trace:
    name: commit messages carry no AI attribution
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: The checker catches a fixture and goes blind when its patterns are removed
        run: tools/ai-trace-commit-check.sh --selftest
      - name: Scan the commits of the pull request
        run: tools/ai-trace-commit-check.sh origin/${{ github.event.pull_request.base.ref }}..HEAD
