name: release-rpm

# A version tag builds the RPMs for x86_64 and aarch64, signs them, publishes them into the rpm/ tree of
# the FreeMixer Pages repository and attaches them to the GitHub release. Anything else, a manual run
# from a branch or the dry run of ci.yml, builds and assembles an unsigned tree and publishes nothing.
# Everything is in FreeMixer/.github; the secrets are the organisation's.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Sign and publish; only a run on a tag publishes'
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  rpm:
    uses: FreeMixer/.github/.github/workflows/build-rpm.yml@main
    with:
      package-name: omx-clap-host
      publish: ${{ github.event_name == 'push' || inputs.publish == true }}
    secrets: inherit
