name: release

# A version tag builds the RPMs and the DEBs, for x86_64/amd64 and aarch64/arm64, signs them, publishes them
# into the rpm/ and deb/ trees of the FreeMixer Pages repository and attaches the RPMs to the GitHub release.
# Anything else, a manual run from a branch or the dry run of ci.yml, builds and assembles unsigned trees and
# publishes nothing. Everything is in FreeMixer/.github; the secrets are the organisation's.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Sign and publish; only a run on a tag publishes'
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # the library's ABI against the baseline of the last release, before any build minutes are spent
  abi:
    uses: ./.github/workflows/abi.yml

  # Only a run on a version tag publishes. A push to a branch is a push too: keying on the event would sign and publish
  # from main, and the dry run of ci.yml is such a push, which passes publish: false.
  rpm:
    needs: abi
    uses: FreeMixer/.github/.github/workflows/build-rpm.yml@v1
    with:
      package-name: omx-clap-host
      publish: ${{ startsWith(github.ref, 'refs/tags/v') && inputs.publish != false }}
    secrets: inherit

  # after the RPMs: both publish into one tree, and a push that loses a race is refused
  deb:
    needs: rpm
    if: ${{ !cancelled() }}
    uses: FreeMixer/.github/.github/workflows/build-deb.yml@v1
    with:
      package-name: omx-clap-host
      publish: ${{ startsWith(github.ref, 'refs/tags/v') && inputs.publish != false }}
    secrets: inherit

  # the generated C API reference, fetched by the website from the release assets: it attaches to a release, so a tag only
  api-docs:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [rpm, deb]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install doxygen
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends doxygen

      - name: Build the HTML and attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          make docs
          version=$(sed -n 's/^CORE_VERSION = //p' Makefile)
          tar -czf "omx-clap-core-api-docs-${version}.tar.gz" -C build/docs html
          gh release upload "$GITHUB_REF_NAME" omx-clap-core-api-docs-*.tar.gz --clobber
