name: fuzz

# The libFuzzer harnesses of fuzz/ (fuzz/README.md), on every push and pull request: the preset file reader, the state
# body it carries and the manifest.ttl the host reads without lilv, each built with clang under AddressSanitizer and
# UndefinedBehaviorSanitizer and fuzzed for 60 s from its seed corpus; every mutant of fuzz/sabotage/ found at the check
# it names; every check's own record met; the coverage witness held to its floor; the corpus current; and each harness
# linked fully static. An input that crashes a harness is uploaded as the fuzz-findings artifact. Only Fedora's
# toolchain is installed: no package of the FreeMixer channel, so no floor to declare.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels the run it supersedes. Every other run (main, a tag) has a group of its own
  # and is never cancelled; the run id keeps two pushes to main from replacing each other while one is queued.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request fuzzes only when it changes what the harnesses are built from or read (the Makefile's FUZZ_DEPS and the
  # fixtures the seed corpus is cut from); main runs it always.
  changes:
    name: what the pull request changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fuzz: ${{ steps.diff.outputs.fuzz }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # The checkout of a pull request is its merge commit and the first parent is the base, so this diff is what the
      # pull request adds. Any other event, or a diff that cannot be read, says true: main and tags always run it.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ] || ! changed=$(git diff --name-only HEAD^1 HEAD) || [ -z "$changed" ]; then
            echo "fuzz=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$changed"
          if grep -qE '^(fuzz/|src/|lv2/tests/fixtures/|Makefile$|\.github/workflows/fuzz\.yml$)' <<<"$changed"; then
            echo "fuzz=true" >> "$GITHUB_OUTPUT"
          else
            echo "fuzz=false" >> "$GITHUB_OUTPUT"
          fi

  fuzz:
    name: fuzz the preset, state and manifest readers
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    runs-on: ubuntu-latest
    # a backstop: fuzz-run spends 60 s on each harness and fuzz-sabotage runs seeds only, so the job ends well inside it
    timeout-minutes: 30
    container:
      image: fedora:44
    steps:
      - name: Install clang, libFuzzer, llvm-cov and the static libc
        run: |
          dnf install -y --setopt=install_weak_deps=False --setopt=retries=10 git clang compiler-rt llvm make gawk \
            diffutils glibc-static

      - uses: actions/checkout@v4

      # fuzz-sabotage applies each mutant with git and restores it with git checkout
      - name: Let git work in the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build the harnesses (clang, libFuzzer, ASan, UBSan)
        run: make fuzz

      - name: The seed corpus is what the fixtures give
        run: make fuzz-corpus-check

      - name: Fuzz each harness for 60 s
        run: make fuzz-run FUZZ_TIME=60

      # a property no mutant can break checks nothing: each one-line mutant must make its harness abort on the seed it
      # names, at the check it names
      - name: Find every mutant, each at its own check
        run: make fuzz-sabotage

      # every check of fuzz/ records the one-line bug it catches and the seed it catches it on, and each record, alone,
      # makes that check abort on that seed
      - name: Meet every check's record
        run: make fuzz-records

      # the seed corpus must keep reaching the reader lines it reaches today (fuzz/coverage-floor.txt) and every
      # property check of every harness
      - name: Hold the coverage floor
        run: make fuzz-coverage

      - name: Each harness linked fully static, over its corpus
        run: make fuzz-static

      - name: Upload the crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: fuzz/findings/
          if-no-files-found: ignore
