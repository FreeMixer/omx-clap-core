name: publish-rpms
description: Sign RPMs and publish them into the FreeMixer/omx-rpms dnf tree

# The release half shared by every FreeMixer host repository, run in a Fedora container. Never call it
# from a push trigger: publishing a package is a release, decided by a person.
#
# THE SHARED-TREE RACE: several repositories commit to the same branch of the channel repository, and
# GitHub's concurrency groups are scoped per repository, so nothing here can serialise against another
# repository's run. The mitigation is structural: `git push` refuses a non-fast-forward, so a race loses
# to that refusal rather than corrupting the tree, and publish-tree.sh places files by name (an identical
# package is a no-op, a new one is added, nothing already there is removed), so a re-run after a refusal
# is safe. Publish one release, wait for it to land, publish the next.
#
# KEY HONESTY: before signing, the imported key's fingerprint is checked against the public key the
# channel's .repo file points dnf at; a mismatch refuses the run rather than sign with a key that
# repo_gpgcheck=1 clients cannot verify.

inputs:
  rpm-dir:
    description: directory holding the RPMs to publish
    required: true
  tag:
    description: the release tag, for the commit message
    required: true
  sign:
    description: 'true signs and pushes; anything else assembles an unsigned tree in build/repo and pushes nothing'
    default: 'false'
  gpg-key:
    description: the signing key, armored
    default: ''
  gpg-passphrase:
    description: its passphrase
    default: ''
  publish-token:
    description: fine-grained token with contents write on the channel repository
    default: ''
  channel:
    description: the channel repository
    default: FreeMixer/omx-rpms
  branch:
    description: its branch
    default: main
  public-key-url:
    description: where dnf fetches the public key from
    default: https://freereac.github.io/rpm/RPM-GPG-KEY-freereac

runs:
  using: composite
  steps:
    - name: Install the packaging tools
      shell: bash
      run: dnf install -y --setopt=install_weak_deps=False createrepo_c rpm-sign gnupg2 pinentry findutils git curl

    - name: Prove the packages are there before anything signs them
      shell: bash
      env:
        RPM_DIR: ${{ inputs.rpm-dir }}
      run: |
        set -o pipefail
        find "$RPM_DIR" -name '*.rpm' | sort | tee /tmp/collected.txt
        test -s /tmp/collected.txt || { echo "::error::no RPM under $RPM_DIR"; exit 1; }

    - name: Import the signing key
      if: inputs.sign == 'true'
      shell: bash
      env:
        GPG_KEY: ${{ inputs.gpg-key }}
        GPG_PASSPHRASE: ${{ inputs.gpg-passphrase }}
        PUBLIC_KEY_URL: ${{ inputs.public-key-url }}
      run: |
        set -o pipefail
        test -n "$GPG_KEY" || { echo "::error::RPM_GPG_KEY is not set; a signed publish cannot proceed"; exit 1; }
        printf '%s\n' "$GPG_KEY" | gpg --batch --import
        KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
        test -n "$KEY_ID" || { echo "::error::no secret key imported from RPM_GPG_KEY"; exit 1; }
        PUB_FPR=$(curl -fsSL "$PUBLIC_KEY_URL" \
          | gpg --batch --with-colons --dry-run --import-options import-show --import 2>/dev/null \
          | awk -F: '/^fpr:/ {print $10; exit}')
        test -n "$PUB_FPR" || { echo "::error::no fingerprint readable from $PUBLIC_KEY_URL"; exit 1; }
        if [ "$PUB_FPR" != "$KEY_ID" ]; then
          echo "::error::RPM_GPG_KEY ($KEY_ID) is not the key dnf is pointed at ($PUB_FPR) -- refusing to sign"
          exit 1
        fi
        echo "OMX_GPG_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
        mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
        echo 'allow-loopback-pinentry' >> ~/.gnupg/gpg-agent.conf
        echo 'pinentry-mode loopback' >> ~/.gnupg/gpg.conf
        printf '%s' "$GPG_PASSPHRASE" > ~/.gnupg/passphrase
        chmod 600 ~/.gnupg/passphrase
        echo "passphrase-file $HOME/.gnupg/passphrase" >> ~/.gnupg/gpg.conf
        gpgconf --kill gpg-agent || true

    - name: Require the channel token before touching the channel
      if: inputs.sign == 'true'
      shell: bash
      env:
        PUBLISH_TOKEN: ${{ inputs.publish-token }}
        CHANNEL: ${{ inputs.channel }}
      run: |
        test -n "$PUBLISH_TOKEN" || {
          echo "::error::REPO_PUBLISH_TOKEN is not set -- add a fine-grained token with contents:write on $CHANNEL as a repository secret"
          exit 1
        }

    # Assembling into an empty directory would describe this run's packages alone, and the push would
    # replace the tree's metadata with it: every other package stays in git and vanishes from dnf. The
    # pulled metadata is discarded so publish-tree.sh regenerates it from the bytes the tree holds.
    - name: Pull the channel tree
      if: inputs.sign == 'true'
      shell: bash
      env:
        PUBLISH_TOKEN: ${{ inputs.publish-token }}
        CHANNEL: ${{ inputs.channel }}
        BRANCH: ${{ inputs.branch }}
      run: |
        set -o pipefail
        auth=$(printf 'x-access-token:%s' "$PUBLISH_TOKEN" | base64 -w0)
        echo "::add-mask::$auth"
        git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
          clone --depth 1 "https://github.com/$CHANNEL.git" build/channel
        git -C build/channel checkout -q -B "$BRANCH"
        mkdir -p build/channel/rpm
        find build/channel/rpm -type d -name repodata -prune -exec rm -rf {} +
        echo "pulled $(find build/channel/rpm -name '*.rpm' | wc -l) package(s) from $CHANNEL"

    - name: Assemble the tree
      shell: bash
      env:
        RPM_DIR: ${{ inputs.rpm-dir }}
        SIGN: ${{ inputs.sign }}
      run: |
        set -o pipefail
        if [ "$SIGN" = true ]; then
          "$GITHUB_ACTION_PATH/publish-tree.sh" build/channel/rpm "$RPM_DIR" "$OMX_GPG_KEY_ID"
        else
          "$GITHUB_ACTION_PATH/publish-tree.sh" build/repo/rpm "$RPM_DIR"
        fi

    - name: Prove the tree holds packages and metadata
      shell: bash
      env:
        SIGN: ${{ inputs.sign }}
      run: |
        set -o pipefail
        if [ "$SIGN" = true ]; then tree=build/channel/rpm; else tree=build/repo/rpm; fi
        find "$tree" -name '*.rpm' | sort
        test -n "$(find "$tree" -name '*.rpm' -print -quit)" || { echo "::error::the tree holds no package"; exit 1; }
        test -n "$(find "$tree" -name repomd.xml -print -quit)" || { echo "::error::no repodata in the tree"; exit 1; }
        if [ "$SIGN" = true ]; then
          test -n "$(find "$tree" -name repomd.xml.asc -print -quit)" || { echo "::error::repodata is not signed"; exit 1; }
        fi

    - name: Push the tree to the channel
      if: inputs.sign == 'true'
      shell: bash
      env:
        PUBLISH_TOKEN: ${{ inputs.publish-token }}
        BRANCH: ${{ inputs.branch }}
        CHANNEL: ${{ inputs.channel }}
        TAG: ${{ inputs.tag }}
      run: |
        set -o pipefail
        git -C build/channel add -A rpm
        if git -C build/channel diff --cached --quiet; then
          echo "the channel already carries this exact tree -- nothing to push"
          exit 0
        fi
        git -C build/channel -c user.name="Pau Aliagas" -c user.email=linuxnow@gmail.com \
          commit -q -m "rpm: publish $TAG"
        auth=$(printf 'x-access-token:%s' "$PUBLISH_TOKEN" | base64 -w0)
        echo "::add-mask::$auth"
        git -C build/channel -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
          push origin "HEAD:refs/heads/$BRANCH"
        echo "published $TAG to $CHANNEL@$BRANCH"
