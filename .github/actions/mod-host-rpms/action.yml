name: mod-host-rpms
description: Build the mod-host and mod-host-protocol-devel RPMs and install them

# What a host repository's RPM build needs for BuildRequires: pkgconfig(mod-host-protocol), and for
# a smoke test the mod-host binary itself. Built from the audinux spec of linuxnow/fedora-spec,
# the package the distribution will carry. Runs in a Fedora container as root.

inputs:
  spec-ref:
    description: commit of linuxnow/fedora-spec holding moddevices/mod-host.spec
    default: 7bfaec3986d75c00c9a984c6d3ce66e1e50b5e51
  out:
    description: directory the RPMs are copied to
    default: mod-host-rpms

runs:
  using: composite
  steps:
    - name: Build the mod-host RPMs
      shell: bash
      env:
        SPEC_REF: ${{ inputs.spec-ref }}
        OUT: ${{ inputs.out }}
      run: '"$GITHUB_ACTION_PATH/build.sh" "$OUT"'

    - name: Install mod-host and its protocol library
      shell: bash
      env:
        OUT: ${{ inputs.out }}
      run: |
        set -euo pipefail
        dnf install -y --setopt=install_weak_deps=False "$OUT"/mod-host-[0-9]*.rpm "$OUT"/mod-host-protocol-devel-*.rpm
        pkg-config --modversion mod-host-protocol
